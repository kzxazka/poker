<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POKER MES – Operator Panel</title>
  <link rel="stylesheet" href="operator.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ══════════════ OPERATOR HEADER ══════════════ -->
  <header class="op-header">
    <div class="op-header-left">
      <span class="op-brand">⚙ POKER <span class="op-brand-accent">MES</span></span>
      <span class="op-role-badge">OPERATOR PANEL</span>
      <button class="op-sync-badge" id="op-sync-status" onclick="loadActiveGame()" title="Klik untuk load/refresh game dari database Supabase">
        <span class="op-sync-dot"></span>
        <span id="op-sync-text">LIVE CONNECTED</span>
      </button>
      <a href="launcher.html" class="op-btn op-btn-secondary op-btn-sm" style="text-decoration:none;">🏠 HUB</a>
    </div>
    <div class="op-header-center">
      <div class="op-info-chip">
        <span class="op-info-label">HAND</span>
        <span class="op-info-value" id="op-hand">#24</span>
      </div>
      <div class="op-info-chip">
        <span class="op-info-label">BLIND</span>
        <span class="op-info-value" id="op-blind">75 / 150</span>
      </div>
      <div class="op-info-chip">
        <span class="op-info-label">CENTER</span>
        <span class="op-info-value gold" id="op-center">11 🏅</span>
      </div>
      <div class="op-info-chip" style="cursor: pointer;" onclick="openTimerSettings()" title="Klik untuk edit timer atau tambah waktu">
        <span class="op-info-label">COUNTDOWN ⏳</span>
        <span class="op-info-value mono" id="op-timer">00:00:00</span>
      </div>
      <!-- Quick Add Time Buttons for Operator -->
      <div style="display:flex;gap:4px;align-items:center;">
        <button class="op-btn op-btn-secondary op-btn-sm" onclick="addTournamentTime(60)" title="Tambah 1 Menit">+1M</button>
        <button class="op-btn op-btn-secondary op-btn-sm" onclick="addTournamentTime(300)" title="Tambah 5 Menit">+5M</button>
        <button class="op-btn op-btn-secondary op-btn-sm" onclick="addTournamentTime(600)" title="Tambah 10 Menit">+10M</button>
      </div>
    </div>
    <div class="op-header-right">
      <button class="op-btn op-btn-secondary" onclick="rollDealerManually()" title="Pindahkan posisi Dealer (D), SB, dan BB ke pemain berikutnya">🔄 ROLL DEALER</button>
      <button class="op-btn op-btn-secondary" onclick="openTimerSettings()">⏱ TIMER SETTINGS</button>
      <button class="op-btn op-btn-secondary" id="btn-pause" onclick="togglePause()">⏸ PAUSE</button>
      <button class="op-btn op-btn-gold" id="btn-newhand" onclick="openNewHand()">+ NEW HAND</button>
    </div>
  </header>

  <!-- ══════════════ MAIN LAYOUT ══════════════ -->
  <div class="op-layout">

    <!-- LEFT: PLAYER CARDS -->
    <div class="op-players-panel">
      <div class="op-panel-title">PLAYER STATUS</div>
      <div class="op-player-grid" id="op-player-grid">
        <!-- Injected by JS -->
      </div>
    </div>

    <!-- RIGHT: ACTION LOG -->
    <div class="op-log-panel">
      <div class="op-panel-title">HAND HISTORY</div>
      <div class="op-log" id="op-log">
        <!-- Injected by JS -->
      </div>
    </div>

  </div>

  <!-- ══════════════ NEW HAND MODAL ══════════════ -->
  <div class="modal-overlay" id="modal-newhand" style="display:none">
    <div class="modal modal-wide">
      <div class="modal-header">
        <div class="modal-title">NEW HAND <span id="modal-hand-num">#24</span></div>
        <button class="modal-close" onclick="closeModal('modal-newhand')">✕</button>
      </div>
      <div class="modal-body">
        <div class="nh-players" id="nh-player-inputs">
          <!-- Injected by JS -->
        </div>
        <div class="nh-winner-section">
          <label class="form-label">WINNER</label>
          <select class="form-select" id="nh-winner">
            <option value="">Select winner…</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="op-btn op-btn-secondary" onclick="closeModal('modal-newhand')">CANCEL</button>
        <button class="op-btn op-btn-gold" onclick="previewHand()">PREVIEW RESULT →</button>
      </div>
    </div>
  </div>

  <!-- ══════════════ CONFIRM RESULT MODAL ══════════════ -->
  <div class="modal-overlay" id="modal-confirm" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">CONFIRM HAND <span id="confirm-hand-num">#24</span></div>
        <button class="modal-close" onclick="closeModal('modal-confirm')">✕</button>
      </div>
      <div class="modal-body" id="confirm-body">
        <!-- Injected by JS -->
      </div>
      <div class="modal-footer">
        <button class="op-btn op-btn-secondary" onclick="closeModal('modal-confirm')">← BACK</button>
        <button class="op-btn op-btn-danger" onclick="confirmHand()">CONFIRM RESULT ✓</button>
      </div>
    </div>
  </div>

  <!-- ══════════════ CONVERT MEDAL MODAL ══════════════ -->
  <div class="modal-overlay" id="modal-convert" style="display:none">
    <div class="modal modal-compact">
      <div class="modal-header">
        <div class="modal-title">CONVERT MEDAL → CHIPS</div>
        <button class="modal-close" onclick="closeModal('modal-convert')">✕</button>
      </div>
      <div class="modal-body" id="convert-body">
        <!-- Injected by JS -->
      </div>
      <div class="modal-footer">
        <button class="op-btn op-btn-secondary" onclick="closeModal('modal-convert')">CANCEL</button>
        <button class="op-btn op-btn-gold" onclick="confirmConvert()">CONFIRM CONVERT ✓</button>
      </div>
    </div>
  </div>

  <!-- ══════════════ TIMER SETTINGS MODAL ══════════════ -->
  <div class="modal-overlay" id="modal-timer" style="display:none">
    <div class="modal modal-compact">
      <div class="modal-header">
        <div class="modal-title">⏱ TIMER & BLIND SETTINGS</div>
        <button class="modal-close" onclick="closeModal('modal-timer')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label class="form-label">BLIND LEVEL SAAT INI</label>
          <select class="form-select" id="timer-blind-level">
            <option value="1">Level 1 (25 / 50)</option>
            <option value="2">Level 2 (50 / 100)</option>
            <option value="3">Level 3 (75 / 150)</option>
            <option value="4">Level 4 (100 / 200)</option>
            <option value="5">Level 5 (125 / 250)</option>
            <option value="6">Level 6 (150 / 300)</option>
            <option value="7">Level 7 (175 / 350)</option>
            <option value="8">Level 8 (200 / 400)</option>
            <option value="9">Level 9 (250 / 500)</option>
            <option value="10">Level 10 (300 / 600)</option>
            <option value="11">Level 11 (350 / 700)</option>
            <option value="12">Level 12 (400 / 800)</option>
          </select>
        </div>

        <div class="form-row">
          <label class="form-label">DURASI TIAP LEVEL (MENIT)</label>
          <input type="number" id="timer-duration-min" min="1" max="120" value="15" class="form-input" />
        </div>

        <div class="form-row">
          <label class="form-label">SISA WAKTU LEVEL SAAT INI (MENIT : DETIK)</label>
          <div style="display:flex;gap:8px;">
            <input type="number" id="timer-current-min" min="0" max="120" placeholder="Menit" class="form-input" style="flex:1;" />
            <input type="number" id="timer-current-sec" min="0" max="59" placeholder="Detik" class="form-input" style="flex:1;" />
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">SISA WAKTU COUNTDOWN TURNAMEN (JAM : MENIT : DETIK)</label>
          <div style="display:flex;gap:8px;">
            <input type="number" id="timer-countdown-hour" min="0" placeholder="Jam" class="form-input" style="flex:1;" />
            <input type="number" id="timer-countdown-min" min="0" max="59" placeholder="Menit" class="form-input" style="flex:1;" />
            <input type="number" id="timer-countdown-sec" min="0" max="59" placeholder="Detik" class="form-input" style="flex:1;" />
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">TAMBAH WAKTU CEPAT KE TURNAMEN</label>
          <div style="display:flex;gap:6px;">
            <button type="button" class="op-btn op-btn-secondary op-btn-sm" style="flex:1;" onclick="addTournamentTime(300)">+5 Menit</button>
            <button type="button" class="op-btn op-btn-secondary op-btn-sm" style="flex:1;" onclick="addTournamentTime(600)">+10 Menit</button>
            <button type="button" class="op-btn op-btn-secondary op-btn-sm" style="flex:1;" onclick="addTournamentTime(900)">+15 Menit</button>
            <button type="button" class="op-btn op-btn-secondary op-btn-sm" style="flex:1;" onclick="addTournamentTime(1800)">+30 Menit</button>
          </div>
        </div>

        <div style="display:flex;gap:6px;margin-top:4px;">
          <button type="button" class="op-btn op-btn-secondary op-btn-sm" style="flex:1;" onclick="resetTimerToStart()">🔄 Reset Countdown ke 2 Jam</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="op-btn op-btn-secondary" onclick="closeModal('modal-timer')">BATAL</button>
        <button class="op-btn op-btn-gold" onclick="saveTimerSettings()">SIMPAN & SYNC ✓</button>
      </div>
    </div>
  </div>

  <!-- ══════════════ CUSTOM ALERT / CONFIRM MODAL ══════════════ -->
  <div class="modal-overlay" id="modal-alert" style="display:none">
    <div class="modal-alert-box">
      <div class="modal-alert-icon gold" id="op-alert-icon-box">
        <span id="op-alert-icon">ℹ</span>
      </div>
      <div class="modal-alert-title" id="op-alert-title">PEMBERITAHUAN</div>
      <div class="modal-alert-msg" id="op-alert-msg">Pesan alert operator...</div>
      <div style="display:flex;gap:10px;justify-content:center;" id="op-alert-actions">
        <button class="op-btn op-btn-gold" style="width:100%;" onclick="closeModal('modal-alert')">MENGERTI</button>
      </div>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="game-state.js"></script>
  <script src="operator.js"></script>
</body>
</html>
